# Local development stack. Grown one service per phase.
# Bring up:   docker compose up -d
# Tear down:  docker compose down        (add -v to also wipe volumes/data)
# Batch jobs: docker compose run --rm spark-batch python processing/silver_job.py

# Shared settings for every container that runs Spark (processing/Dockerfile). Inside the Docker
# network services are reached by name, so these override the localhost values in .env.
x-spark-env: &spark-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  MINIO_ENDPOINT: http://minio:9000
  WAREHOUSE_HOST: postgres
  WAREHOUSE_PORT: "5432"

x-spark: &spark
  build:
    context: .
    dockerfile: processing/Dockerfile
    target: spark
  image: stock-spark
  env_file: .env
  environment: *spark-env

# Shared settings for the Airflow containers (the spark image plus Airflow). Airflow keeps its own
# metadata in a separate "airflow" database on the same Postgres server, and runs tasks with the
# LocalExecutor, so the scheduler executes them in its own container.
x-airflow: &airflow
  build:
    context: .
    dockerfile: processing/Dockerfile
    target: airflow
  image: stock-airflow
  env_file: .env
  environment:
    <<: *spark-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${WAREHOUSE_USER}:${WAREHOUSE_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__DAGS_FOLDER: /app/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
  volumes:
    - ./dags:/app/dags            # DAG edits apply without rebuilding the image
    - airflow_logs:/opt/airflow/logs   # shared so the webserver can show the scheduler's task logs

services:
  # Object storage (S3 compatible). Holds bronze/silver/gold layers later.
  minio:
    image: minio/minio:latest
    container_name: stock-minio
    ports:
      - "9000:9000"   # S3 API endpoint
      - "9001:9001"   # web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}          # injected from .env
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}  # injected from .env
    volumes:
      - minio_data:/data   # named volume so data survives restarts
    command: server /data --console-address ":9001"

  # Coordinates the Kafka broker (leader election, metadata).
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: stock-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log

  # The Kafka broker: the durable, ordered event log.
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: stock-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"   # host access (our producer runs on the Mac, not in a container)
    # If ZooKeeper still holds the previous broker's registration at startup, Kafka exits with
    # NodeExists; that entry expires within seconds, so restarting is enough to recover.
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: one for other containers (kafka:29092), one for the host (localhost:9092).
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data

  # Web UI to see topics, partitions, and messages.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: stock-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"   # open http://localhost:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # Polls yfinance and publishes stock events to Kafka (ingestion/Dockerfile).
  producer:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    image: stock-producer
    container_name: stock-producer
    depends_on:
      - kafka
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the Docker network the broker is kafka:29092; localhost would be this container.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8000:8000"   # Prometheus /metrics

  # Spark Structured Streaming: Kafka -> bronze + quarantine, running continuously.
  streaming:
    <<: *spark
    container_name: stock-streaming
    command: ["python", "processing/streaming_job.py"]
    depends_on:
      - kafka
      - minio
    restart: unless-stopped
    volumes:
      # Checkpoints live on the host so a restarted container resumes from its committed offsets.
      - ./spark-checkpoints:/app/spark-checkpoints

  # One-off Spark batch jobs (silver, gold, warehouse load). Not started by `up`; run on demand.
  spark-batch:
    <<: *spark
    profiles: ["batch"]
    depends_on:
      - minio
      - postgres

  # SQL warehouse: holds the Gold summary for analysts to query.
  postgres:
    image: postgres:16
    container_name: stock-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD}
      POSTGRES_DB: ${WAREHOUSE_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER} -d ${WAREHOUSE_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-time Airflow setup: create the airflow database, migrate it, create the admin login.
  airflow-init:
    <<: *airflow
    container_name: stock-airflow-init
    command: ["bash", "scripts/airflow-init.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  # Airflow UI at http://localhost:8081 (Kafka UI already uses 8080).
  airflow-webserver:
    <<: *airflow
    container_name: stock-airflow-webserver
    command: ["airflow", "webserver"]
    ports:
      - "8081:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Schedules the DAG and, with the LocalExecutor, runs its Spark tasks.
  airflow-scheduler:
    <<: *airflow
    container_name: stock-airflow-scheduler
    command: ["airflow", "scheduler"]
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_started

  # Metrics store: scrapes the producer's /metrics endpoint on the host.
  prometheus:
    image: prom/prometheus:latest
    container_name: stock-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Dashboards over the metrics (login: admin / admin by default).
  grafana:
    image: grafana/grafana:latest
    container_name: stock-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

# Named volumes are managed by Docker and persist across up/down.
volumes:
  minio_data:
  kafka_data:
  zookeeper_data:
  zookeeper_log:
  postgres_data:
  grafana_data:
  airflow_logs:
